# HelloIAM Studio — VPS deploy
# UI: http://SERVER_IP:3456

services:
  helloiam-studio_v0.0.1:
    container_name: helloiam-studio_v0.0.1
    image: helloiam-studio:v0.0.1
    build: .
    restart: unless-stopped
    ports:
      - "0.0.0.0:3456:3456"
      - "0.0.0.0:3000:3000"
    environment:
      HOST: 0.0.0.0
      STUDIO_PORT: 3000
      GALLERY_PORT: 3456
      NODE_ENV: production
    volumes:
      - ./public/generated:/app/public/generated
      - ./out/renders:/app/out/renders
      - ./src/templates:/app/src/templates
    shm_size: "2gb"
    mem_limit: 2g
