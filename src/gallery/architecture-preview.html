<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Hello I Am — New IA Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Instrument+Sans:wght@700&family=Inter:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/architecture-preview.css" />
    <script src="/architecture-project-config.js"></script>
  </head>
  <body>
    <div class="preview-shell">
      <aside class="preview-sidebar" aria-label="New architecture navigation">
        <div class="preview-brand">
          <a href="#/dashboard" id="preview-project-name">Hello I Am</a>
          <span>New IA</span>
        </div>
        <nav class="preview-nav" id="preview-nav"></nav>
        <div class="preview-mode-switch" aria-label="Architecture mode">
          <span>Architecture</span>
          <div>
            <a href="/picker.html#/dashboard" id="architecture-current-link">Current</a>
            <span aria-current="page">New IA</span>
          </div>
        </div>
      </aside>

      <div class="preview-workspace">
        <header class="preview-header">
          <button type="button" class="preview-menu-button" id="preview-menu-button" aria-expanded="false" aria-controls="preview-sidebar">Menu</button>
          <div>
            <span class="preview-kicker" id="preview-breadcrumb">Hello I Am / Dashboard</span>
            <h1 id="preview-title">Dashboard</h1>
          </div>
          <span class="preview-badge">UI prototype</span>
        </header>
        <nav class="preview-subnav" id="preview-subnav" aria-label="Section navigation"></nav>
        <main class="preview-main" id="preview-main"></main>
      </div>
    </div>

    <script>
      const ARCHITECTURE_MODE_KEY = "helloiam-architecture-mode";
      const projectConfig = window.ARCHITECTURE_PROJECT_CONFIG;
      const moduleCatalog = [
        { id: "dashboard", label: "Dashboard", href: "#/dashboard" },
        { id: "brand", label: "Brand", href: "#/brand" },
        { id: "research", label: "Research", href: "#/research/trends" },
        { id: "content", label: "Content", href: "#/content/posts" },
        { id: "cases", label: projectConfig.labels.cases || "Cases", href: "#/cases/all" },
        { id: "opportunities", label: projectConfig.labels.opportunities || "Opportunities", href: "#/opportunities/candidates" },
        { id: "creative-tools", label: "Creative tools", href: "#/creative-tools/post-generator" },
        { id: "analytics", label: "Analytics", href: "#/analytics" },
        { id: "site", label: "Site", href: "#/site" },
        { id: "knowledge", label: "Knowledge", href: "#/knowledge/docs" },
        { id: "systems", label: "Systems", href: "#/systems" },
      ];
      const navItems = moduleCatalog
        .filter((item) => projectConfig.enabledModules.includes(item.id))
        .map((item, index) => ({ ...item, index: String(index + 1).padStart(2, "0") }));
      const subnav = {
        brand: [
          ["overview", "Brand info"], ["presets", "Brand presets"], ["guidelines", "Visual guidelines"], ["assets", "Brand assets"],
        ],
        research: [
          ["trends", "Trends"], ["search", "Search"], ["favorites", "Favorites"], ["archive", "Archive"],
        ],
        content: [
          ["posts", "Posts"], ["calendar", "Calendar"], ["assets", "Media library"],
        ],
        cases: [
          ["all", "All"], ["published", "Published"], ["drafts", "Drafts"], ["archive", "Archive"],
        ],
        opportunities: [
          ["candidates", "Candidates"], ["partners", "Partners"], ["active", "Active"], ["archive", "Archive"],
        ],
        "creative-tools": [
          ["post-generator", "Post generator"], ["item-generator", "Item generator"], ["product-card", "Product cards"], ["template-studio", "Template studio"], ["image-generator", "Image generator"], ["video-generator", "Video generator"], ["share-cards", "Share cards"],
        ],
        analytics: [
          ["content", "Content"], ["channels", "Channels"], ["research", "Research"], ["production", "Production"], ["formats", "Format comparison"],
        ],
        site: [
          ["overview", "Overview"], ["pages", "Pages & routes"], ["content", "Content"], ["seo", "SEO & share"], ["forms", "Forms & leads"], ["publishing", "Publishing"], ["files", "Files"],
        ],
        systems: [
          ["changelog", "Changelog"], ["ai", "AI settings"], ["integrations", "Integrations"], ["automation", "Automation"], ["runtime", "Runtime"], ["access", "Access"],
        ],
        knowledge: [
          ["docs", "Docs"], ["runbooks", "Runbooks"], ["references", "References"], ["pipelines", "Pipeline map"], ["decisions", "Decisions"], ["archive", "Archive"],
        ],
      };
      const defaults = {
        brand: "overview", research: "trends", content: "posts", cases: "all", opportunities: "candidates", "creative-tools": "post-generator", analytics: "content", site: "overview", knowledge: "docs", systems: "changelog",
      };
      const analyticsChannelViews = ["overview", "instagram", "youtube", "tiktok", "website", "email", "comparison"];
      const validTopRoutes = new Set(navItems.map((item) => item.id));
      const mascotAttributes = ["Face", "Head", "Body", "Controls", "Storage", "Arms / Hands", "Modules", "Labels", "Finish"];
      let mascotBuilt = false;
      let mascotGenerated = false;
      let selectedPose = "03";
      const trendFilters = {period: "day", source: "all", hashtag: ""};
      const mediaFilters = {query: "", source: "all", usage: "all"};
      let mediaCache = null;

      const escapeHtml = (value) => String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

      function sectionSubnavItems(section) {
        const items = subnav[section];
        if (section !== "creative-tools" || !items) return items;
        return items.filter(([id]) => projectConfig.enabledTools.includes(id));
      }

      function parseRoute() {
        const raw = window.location.hash.replace(/^#\/?/, "");
        const legacyRoutes = {
          "projects/all": "#/knowledge/archive",
          "projects/published": "#/knowledge/archive",
          "projects/drafts": "#/knowledge/archive",
          "projects/archive": "#/knowledge/archive",
          "projects/test-pack": "#/knowledge/archive",
          "cases/all": "#/knowledge/archive",
          "cases/published": "#/knowledge/archive",
          "cases/drafts": "#/knowledge/archive",
          "cases/archive": "#/knowledge/archive",
          "cases/test-pack": "#/knowledge/archive",
          "research/news": "#/research/trends",
          "research/videos": "#/research/trends",
          "analytics/published": "#/analytics/channels/overview",
          "brand/collabs": "#/opportunities/candidates",
          "content/create": "#/creative-tools/post-generator",
          "content/mascots": "#/creative-tools/item-generator",
          "content/prompts": "#/systems/ai",
          "content/pipeline-map": "#/knowledge/pipelines",
          "content/pipelines": "#/knowledge/pipelines",
          "creative-tools/emoji-generator": "#/creative-tools/item-generator",
          "creative-tools/mascot-generator": "#/creative-tools/item-generator",
        };
        if (legacyRoutes[raw]) {
          window.location.replace(legacyRoutes[raw]);
          return null;
        }
        const [sectionRaw, subRaw, detailRaw] = raw.split("/");
        const section = sectionRaw || "dashboard";
        if (!validTopRoutes.has(section)) return { invalid: true };
        const items = sectionSubnavItems(section);
        if (!items) return { section, sub: "" };
        const candidate = subRaw || defaults[section];
        const sub = items.some(([id]) => id === candidate) ? candidate : items[0][0];
        const detail = section === "analytics" && sub === "channels" && analyticsChannelViews.includes(detailRaw) ? detailRaw : section === "analytics" && sub === "channels" ? "overview" : "";
        return { section, sub, detail };
      }

      function previewToCurrentHash(route) {
        if (route.section === "brand") return route.sub === "collabs" ? "#/brand/collabs" : "#/brand";
        if (route.section === "research") return "#/news-trends";
        if (route.section === "content") {
          if (route.sub === "assets") return "#/content/images";
          return "#/content/posts";
        }
        if (route.section === "cases") return "#/content/posts";
        if (route.section === "opportunities") return "#/brand/collabs";
        if (route.section === "creative-tools") {
          if (route.sub === "post-generator" || route.sub === "item-generator") return "#/content/create";
          return "#/content/images";
        }
        if (route.section === "analytics") return "#/analytics";
        if (route.section === "site") return "#/site";
        if (route.section === "knowledge") return route.sub === "pipelines" || route.sub === "references" ? "#/content/pipeline-map" : "#/systems/changelog";
        if (route.section === "systems") return route.sub === "ai" ? "#/content/prompts" : "#/systems/changelog";
        return "#/dashboard";
      }

      function statCard(label, value, note) {
        return `<article class="preview-stat"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong><p>${escapeHtml(note)}</p></article>`;
      }

      function featureCard(title, description, meta = "Prototype") {
        return `<article class="preview-card"><span class="preview-card-meta">${escapeHtml(meta)}</span><h3>${escapeHtml(title)}</h3><p>${escapeHtml(description)}</p></article>`;
      }

      function factRow(label, value, note = "") {
        return `<div class="preview-fact-row"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong>${note ? `<p>${escapeHtml(note)}</p>` : ""}</div>`;
      }

      function sourceNote(text) {
        return `<div class="preview-source-note"><span>Source</span><p>${escapeHtml(text)}</p><a href="https://bots-n-bones.com/works/helloiam-am?from=works" target="_blank" rel="noreferrer">Open Bots &amp; Bones case ↗</a></div>`;
      }

      function pageIntro(label, title, description, action = "") {
        return `<section class="preview-intro"><div><span>${escapeHtml(label)}</span><h2>${escapeHtml(title)}</h2><p>${escapeHtml(description)}</p></div>${action}</section>`;
      }

      function renderDashboard() {
        return `${pageIntro("Project dashboard", "HelloIAM at a glance", "A combined operational picture of this project: research, production, media, publishing, partnerships and system changes.", '<a class="preview-primary" href="#/creative-tools/post-generator">Create post</a>')}<div id="dashboard-live" class="preview-live-region"><div class="preview-empty">Loading project state…</div></div>`;
      }

      function renderBrand(sub) {
        if (sub === "overview") return `
          ${pageIntro("Brand / Brand info", "Armenia introduces itself", "Hello I Am . AM is a travel and cultural brand that presents Armenia through contemporary visual storytelling.")}
          <div class="preview-brand-statement"><span>Positioning</span><h3>A human, contemporary Armenia — told through objects, rituals, places and everyday details instead of tourism clichés.</h3></div>
          <div class="preview-facts-grid">
            ${factRow("Name idea", "I am / AM", "A personal introduction paired with Armenia’s country code.")}
            ${factRow("Core system", "Armenia through objects", "One visual language connects culture, content and the website.")}
            ${factRow("Editorial lenses", "Food · Road · Place · Ritual", "Lenses for discovering the country, not service categories.")}
            ${factRow("Tone", "Human · contemporary · specific", "Warm and curious; free from conventional travel advertising.")}
          </div>
          <section class="preview-section-head"><div><span>Working audiences · prototype assumption</span><h2>Who the system speaks to</h2></div></section>
          <div class="preview-grid preview-grid-three">
            ${featureCard("Culture-led travellers", "People choosing a destination through food, design, stories and local detail.", "Primary audience")}
            ${featureCard("Armenian diaspora", "People reconnecting with a contemporary expression of Armenian culture.", "Community")}
            ${featureCard("Local makers & hosts", "Chefs, guides, artists and places that can become part of the object-led story.", "Contributors")}
          </div>${sourceNote("Positioning and naming are taken from the published Hello I Am . AM case. Audience groups are working assumptions for this prototype.")}`;
        if (sub === "presets") return `${pageIntro("Brand / Brand presets", "Inputs for every generator", "Presets package positioning, voice, design tokens and generation constraints before content is created.")}<div class="preview-shared-pipeline-note"><span>Input, not output</span><p>Generators select a preset; they do not invent the brand rules themselves.</p></div><div id="brand-presets-live" class="preview-live-region"><div class="preview-empty">Loading brand presets…</div></div>`;
        if (sub === "guidelines") return `
          ${pageIntro("Brand / Visual guidelines", "One object. One frame. One line.", "A deliberately plain system gives every Armenian object room to keep its own character.")}
          <section class="preview-section-head"><div><span>Identity</span><h2>Color system</h2></div></section>
          <div class="preview-palette">
            ${[["Cream","#FFF3D8","Brand canvas · posts"],["Cream soft","#FFF9EA","Light surfaces"],["Ink","#17110B","Wordmark · text"],["Red","#FF3B12","Accent · links"],["Yellow","#FFC83D","Emoji highlight"],["Blue","#245DFF","Emoji accents"],["Green","#3C7B36","Emoji accents"],["Dark","#17120D","Video plates"]].map(([name,hex,use]) => `<article style="--swatch:${hex}"><i></i><span>${escapeHtml(name)}</span><strong>${escapeHtml(hex)}</strong><p>${escapeHtml(use)}</p></article>`).join("")}
          </div>
          <section class="preview-section-head"><div><span>Identity</span><h2>Typography</h2></div></section>
          <div class="preview-type-specimen"><article><span>Logo · Instrument Sans 760 · lowercase</span><h3 class="preview-logo-type">hello i am . am</h3></article><article><span>Display · Space Grotesk 560</span><h3>A new way to experience Armenia</h3></article><article><span>Body · IBM Plex Sans 400</span><p>Food, roads, places, objects and small cultural moments become a visual language.</p></article><article><span>Mono · IBM Plex Mono 500</span><code>FOOD · ROAD · PLACE · RITUAL</code></article></div>
          <section class="preview-section-head"><div><span>Composition rules</span><h2>Stable frame, expressive object</h2></div></section>
          <div class="preview-grid preview-grid-three">${featureCard("Unit", "One dish, place, ritual or detail per frame.", "01")}${featureCard("Placement", "Object centred on warm cream with generous air around it.", "02")}${featureCard("Caption", "The construction stays “Hello, I am …”; only the object name changes.", "03")}</div>
          ${sourceNote("Palette, type hierarchy, composition and editorial lenses are taken from the published case.")}`;
        return `
          ${pageIntro("Brand / Brand assets", "Brand assets", "Reusable identity building blocks that every project and generator can reference.")}
          <div class="preview-grid preview-grid-three">
            ${featureCard("Logo system", "The AM mark works as both an introduction and Armenia’s country code; it is never re-lettered.", "Core asset")}
            ${featureCard("50 emoji objects", "Food, roads, places and rituals: from khorovats and duduk to Ararat, tuf and Armenian cars.", "Object library")}
            ${featureCard("Editorial references", "Object posts, atmospheric videos and comic-style news cards.", "Approved outputs")}
          </div>
          <section class="preview-section-head"><div><span>Production formats</span><h2>One object, every channel</h2></div></section>
          <div class="preview-format-strip">${[["1:1","Object post","Feed · 1080×1080"],["4:5","Carousel","Route · multi-slide"],["9:16","Reels · Stories","Vertical object video"],["16:9","Site · covers","Hero and editorial covers"]].map(([ratio,name,use]) => `<article><strong>${ratio}</strong><span>${escapeHtml(name)}</span><p>${escapeHtml(use)}</p></article>`).join("")}</div>
          <section class="preview-section-head"><div><span>Live Current storage</span><h2>Available brand media</h2></div><a href="#/content/assets">Open Media library</a></section><div id="brand-assets-live" class="preview-live-region"><div class="preview-empty">Loading brand media…</div></div>
          ${sourceNote("The object library size, content formats and usage rules are documented in the published case.")}`;
      }

      function researchCard(type, title, description, metric) {
        return `<article class="preview-signal-card"><div><span>${escapeHtml(type)}</span><span>${escapeHtml(metric)}</span></div><h3>${escapeHtml(title)}</h3><p>${escapeHtml(description)}</p><footer><button type="button" class="preview-text-action" data-favorite>☆ Save</button><button type="button" class="preview-primary preview-small" data-use-source="${escapeHtml(title)}">Use in post</button></footer></article>`;
      }

      function researchToolbar(source) {
        const youtube = source === "videos" || source === "trends";
        return `<div class="preview-research-toolbar"><button type="button" class="preview-primary" data-collect-research="${youtube ? "youtube" : "news"}">${youtube ? "Parse YouTube now" : "Parse news now"}</button><span data-collect-status>Uses the same Current collector</span><label>Collection date<select id="research-date-select" disabled><option>Loading…</option></select></label></div>`;
      }

      function renderResearch(sub) {
        if (sub === "trends") return `
          ${pageIntro("Research / Trends", "What is moving now", "One trend workspace across connected channels, with period, source and hashtag controls.")}
          <form class="preview-trend-controls" id="trend-controls">
            <label><span>Period</span><select name="period"><option value="day" ${trendFilters.period === "day" ? "selected" : ""}>Today</option><option value="week" ${trendFilters.period === "week" ? "selected" : ""}>Week</option><option value="month" ${trendFilters.period === "month" ? "selected" : ""}>Month</option></select></label>
            <label><span>Source</span><select name="source"><option value="all" ${trendFilters.source === "all" ? "selected" : ""}>All connected</option><option value="youtube" ${trendFilters.source === "youtube" ? "selected" : ""}>YouTube</option><option value="news" ${trendFilters.source === "news" ? "selected" : ""}>News</option><option value="tiktok" ${trendFilters.source === "tiktok" ? "selected" : ""}>TikTok · not connected</option></select></label>
            <label class="is-wide"><span>Hashtag</span><input name="hashtag" value="${escapeHtml(trendFilters.hashtag)}" placeholder="#armenia or leave empty" /></label>
            <button class="preview-primary" type="submit">Apply</button>
          </form>
          <div class="preview-research-toolbar"><button type="button" class="preview-primary" data-collect-research="youtube">Parse YouTube now</button><button type="button" class="preview-secondary" data-collect-research="news">Parse news now</button><span data-collect-status>Updates the same Current archives</span></div>
          <div id="research-live" class="preview-live-region"><div class="preview-empty">Loading cross-channel trends…</div></div>`;
        if (sub === "favorites") return `${pageIntro("Research / Favorites", "Saved sources from Current", "News and YouTube bookmarks use the same favorites store as Current.")}<div id="research-live" class="preview-live-region"><div class="preview-empty">Loading Favorites…</div></div>`;
        if (sub === "search") return `${pageIntro("Research / Search", "Keyword search", "A separate workspace for finding exact subjects and phrases across News and YouTube archives.")}<form class="preview-search" id="research-search"><label for="search-query">Words or phrase</label><div><input id="search-query" placeholder="e.g. Armenian architecture" /><button class="preview-primary" type="submit">Search</button></div></form><div id="research-live" class="preview-live-region"><div class="preview-empty">Enter words to search the Current archive. Hashtag exploration belongs in Trends.</div></div>`;
        return `${pageIntro("Research / Archive", "Browse collection history", "Every saved News, YouTube and Trends snapshot, grouped by its actual collection date.")}<div id="research-live" class="preview-live-region"><div class="preview-empty">Loading Archive…</div></div>`;
      }

      function renderPostWorkflow() {
        return `
          ${pageIntro("Creative tools / Post generator", "The Current Create pipeline", "This is the same production module used by Current: the same templates, format-specific steps, validation, generation, export and gallery.", '<a class="preview-secondary" href="/picker.html#/content/create" data-current-link>Open full screen ↗</a>')}
          <div class="preview-shared-pipeline-note"><span>Shared production module</span><p>Changes made here are real and appear in Current Posts. New IA no longer keeps a separate mock pipeline.</p></div>
          <iframe class="preview-current-create-frame" src="/picker.html?embed=content#/content/create" title="Current Create pipeline"></iframe>`;
      }

      function renderMascot() {
        return `
          ${pageIntro("Creative tools / Item generator", "Project item: mascot", "The universal Item Generator slot uses a mascot workflow for this project: theme, pose and nine project-specific attributes.")}
          <div class="preview-shared-pipeline-note"><span>Project implementation</span><p>${escapeHtml(projectConfig.itemGenerator?.implementationLabel || "Mascot generator")}</p></div>
          <div class="preview-mascot-layout">
            <section class="preview-mascot-pose"><span>01 · Pose</span><div class="preview-mascot-figure" aria-label="Selected mascot pose"><i></i><b></b><em></em></div><div class="preview-pose-list">${["01","02","03","04","05","06","07","08"].map((pose) => `<button type="button" class="${pose === selectedPose ? "is-selected" : ""}" data-pose="${pose}">${pose}</button>`).join("")}</div></section>
            <section class="preview-mascot-builder"><span>02 · Theme and attributes</span><label for="mascot-theme">Theme</label><div class="preview-inline-field"><input id="mascot-theme" value="${mascotBuilt ? "A calm field research bot" : ""}" placeholder="e.g. A field research bot" /><button class="preview-primary" id="build-attributes" type="button">Build attributes</button></div><div class="preview-attribute-grid">${mascotAttributes.map((name, index) => `<label><span>${String(index + 1).padStart(2,"0")} · ${escapeHtml(name)}</span><input ${mascotBuilt ? "" : "disabled"} value="${mascotBuilt ? escapeHtml(`${name} detail for a calm research character`) : ""}" placeholder="Build from the theme" /></label>`).join("")}</div><div class="preview-generate-row"><span id="mascot-status">${mascotGenerated ? "Prototype result ready · not saved" : mascotBuilt ? "9 attributes ready for review" : "Build attributes to continue"}</span><button type="button" class="preview-primary" id="generate-mascot" ${mascotBuilt ? "" : "disabled"}>Generate mascot</button></div>${mascotGenerated ? '<div class="preview-prototype-result"><div class="preview-mascot-figure"><i></i><b></b><em></em></div><div><span>Gallery preview</span><h3>Calm field research bot</h3><p>Front pose · 9 attributes · local prototype state</p></div></div>' : ""}</section>
          </div>`;
      }

      function renderEmojiItemGenerator() {
        const config = projectConfig.itemGenerator || {};
        return `${pageIntro("Creative tools / Item generator", "Project item: emoji object", "The universal Item Generator slot is implemented for HelloIAM as a branded Armenian emoji-object generator. Other projects can replace this workflow without changing the architecture.")}
          <div class="preview-shared-pipeline-note"><span>Project implementation</span><p>${escapeHtml(config.implementationLabel || "HelloIAM emoji objects")} · generated results are saved to the real Current emoji catalog.</p></div>
          <form class="preview-item-generator-form" id="item-generator-form">
            <label for="item-generator-subject"><span>Object subject</span><strong>What should HelloIAM turn into an emoji?</strong></label>
            <div><input id="item-generator-subject" name="name" required maxlength="100" placeholder="${escapeHtml(config.subjectPlaceholder || "e.g. pomegranate")}" /><button type="submit" class="preview-primary">Generate item</button></div>
            <p data-item-generator-status>Uses the existing HelloIAM image-generation pipeline and style reference.</p>
          </form>
          <section class="preview-section-head"><div><span>Current catalog</span><h2>Reusable HelloIAM items</h2></div></section>
          <div id="item-generator-live" class="preview-live-region"><div class="preview-empty">Loading item catalog…</div></div>`;
      }

      function renderItemGenerator() {
        return projectConfig.itemGenerator?.kind === "mascot" ? renderMascot() : renderEmojiItemGenerator();
      }

      function renderContent(sub) {
        const data = {
          posts: ["Posts", "Individual publication units from the same storage used by Current.", []],
          calendar: ["Calendar", "A shared publishing schedule with channel, owner, approval and release status.", [["This week", "4 planned publications"],["Awaiting approval", "2 content drafts"],["Published", "12 items this month"]]],
          assets: ["Media library", "Working images and generated files from the same storage used by Current.", []],
        }[sub];
        if (sub === "posts") {
          return `${pageIntro("Content / Posts", "The Current Posts workspace", "This is the same working Posts module used by Current: the same table, statuses, preview, downloads and post actions.", '<a href="/picker.html#/content/posts" class="preview-secondary" data-current-link>Open full screen ↗</a>')}
            <div class="preview-shared-pipeline-note"><span>Shared production module</span><p>Posts and actions shown here are real. New IA no longer maintains a separate read-only card list.</p></div>
            <iframe class="preview-current-posts-frame" src="/picker.html?embed=content#/content/posts" title="Current Posts workspace"></iframe>`;
        }
        if (sub === "assets") {
          return `${pageIntro(`Content / ${data[0]}`, data[0], "Search and filter every available media file by origin and usage.")}

      function bindCollabActions(root, route) {
        root.querySelectorAll("[data-collab-noop]").forEach((link) => link.addEventListener("click", (event) => event.preventDefault()));
        root.querySelector("[data-collab-new]")?.addEventListener("click", () => {
          collabEditingId = "";
          collabEditorOpen = true;
          root.innerHTML = renderCollabWorkspace(route.sub);
          bindCollabActions(root, route);
          root.querySelector("#collab-form input")?.focus();
        });
        root.querySelector("[data-collab-search]")?.addEventListener("input", (event) => {
          collabQuery = event.currentTarget.value;
          root.innerHTML = renderCollabWorkspace(route.sub);
          bindCollabActions(root, route);
          const search = root.querySelector("[data-collab-search]");
          search?.focus();
          search?.setSelectionRange(collabQuery.length, collabQuery.length);
        });
        root.querySelector("[data-collab-cancel]")?.addEventListener("click", () => {
          collabEditingId = "";
          collabEditorOpen = false;
          root.innerHTML = renderCollabWorkspace(route.sub);
          bindCollabActions(root, route);
        });
        root.querySelectorAll("[data-collab-edit]").forEach((button) => button.addEventListener("click", () => {
          collabEditingId = button.dataset.collabEdit;
          collabEditorOpen = true;
          root.innerHTML = renderCollabWorkspace(route.sub);
          bindCollabActions(root, route);
          root.querySelector("#collab-form")?.scrollIntoView({behavior: "smooth", block: "start"});
        }));
        root.querySelector("#collab-form")?.addEventListener("submit", async (event) => {
          event.preventDefault();
          const form = event.currentTarget;
          const id = form.dataset.collabId;
          const submit = form.querySelector('button[type="submit"]');
          const status = form.querySelector("[data-collab-form-status]");
          submit.disabled = true;
          status.textContent = "Saving…";
          try {
            const body = Object.fromEntries(new FormData(form).entries());
            const response = await fetch(id ? `/api/collabs/${encodeURIComponent(id)}` : "/api/collabs", {method: id ? "PUT" : "POST", headers: {"Content-Type": "application/json", Accept: "application/json"}, body: JSON.stringify(body)});
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "Could not save Collab");
            collabEditingId = "";
            collabEditorOpen = false;
            const saved = data.item;
            const destination = saved.status === "candidate" ? "candidates" : saved.status === "partner" ? "partners" : saved.status === "active" ? "active" : "archive";
            if (destination !== route.sub) window.location.hash = `#/opportunities/${destination}`;
            else await loadLiveData(route);
          } catch (error) {
            submit.disabled = false;
            status.textContent = error.message;
          }
        });
        root.querySelectorAll("[data-collab-status]").forEach((select) => select.addEventListener("change", async () => {
          select.disabled = true;
          try {
            const response = await fetch(`/api/collabs/${encodeURIComponent(select.dataset.collabStatus)}`, {method: "PUT", headers: {"Content-Type": "application/json", Accept: "application/json"}, body: JSON.stringify({status: select.value})});
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "Could not update stage");
            await loadLiveData(route);
          } catch (error) {
            select.disabled = false;
            window.alert(error.message);
          }
        }));
        root.querySelectorAll("[data-collab-delete]").forEach((button) => button.addEventListener("click", async () => {
          const item = collabCache.items.find((entry) => entry.id === button.dataset.collabDelete);
          if (!window.confirm(`Delete “${item?.title || "this Collab"}”?`)) return;
          button.disabled = true;
          try {
            const response = await fetch(`/api/collabs/${encodeURIComponent(button.dataset.collabDelete)}`, {method: "DELETE", headers: {Accept: "application/json"}});
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "Could not delete Collab");
            await loadLiveData(route);
          } catch (error) {
            button.disabled = false;
            window.alert(error.message);
          }
        }));
      }

      function formatLiveDate(value, dateOnly = false) {
        if (!value) return "—";
        const date = new Date(dateOnly ? `${value}T12:00:00` : value);
        if (Number.isNaN(date.getTime())) return value;
        return new Intl.DateTimeFormat("ru-RU", dateOnly
          ? {day: "numeric", month: "short", year: "numeric"}
          : {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"}
        ).format(date);
      }

      function formatLiveNumber(value) {
        return new Intl.NumberFormat("ru-RU", {notation: Number(value) >= 10000 ? "compact" : "standard", maximumFractionDigits: 1}).format(Number(value) || 0);
      }

      function safeExternalUrl(value) {
        try {
          const url = new URL(value);
          return ["http:", "https:"].includes(url.protocol) ? url.href : "#";
        } catch {
          return "#";
        }
      }

      function publicMediaUrl(assetPath) {
        return `/public/${String(assetPath).split("/").map(encodeURIComponent).join("/")}`;
      }

      async function fetchLiveJson(url) {
        const response = await fetch(url, {headers: {Accept: "application/json"}});
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
        return data;
      }

      function liveSummary(items) {
        return `<div class="preview-live-summary">${items.map(([label, value]) => `<div><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`).join("")}</div>`;
      }

      function renderLivePosts(posts) {
        const ready = posts.filter((post) => post.hasRender).length;
        const visible = posts.slice(0, 30);
        return `${liveSummary([["Total posts", String(posts.length)], ["Rendered", String(ready)], ["Drafts", String(posts.length - ready)]])}
          <div class="preview-live-grid">${visible.map((post) => {
            const imagePath = post.lastRender?.cards?.[0]?.stillUrl || (post.firstCard?.props?.image ? publicMediaUrl(post.firstCard.props.image) : "");
            return `<article class="preview-live-card">
              <div class="preview-live-media">${imagePath ? `<img src="${escapeHtml(imagePath)}" alt="" loading="lazy" />` : `<span>${escapeHtml(post.templateName || "Post")}</span>`}</div>
              <div class="preview-live-body"><div class="preview-live-meta"><span>${escapeHtml(post.templateName || post.templateId || "Post")}</span><span>${post.hasRender ? "Rendered" : "Draft"}</span></div><h3>${escapeHtml(post.name || post.subject || post.templateName || "Untitled post")}</h3><p>${escapeHtml(`${post.cardCount || 0} slides · updated ${formatLiveDate(post.updatedAt)}`)}</p><a href="/picker.html#/content/posts/${encodeURIComponent(post.id)}" data-current-link>Open in Current</a></div>
            </article>`;
          }).join("")}</div>${posts.length > visible.length ? `<p class="preview-live-footnote">Showing ${visible.length} latest posts of ${posts.length}.</p>` : ""}`;
      }

      function renderLiveAssets(data) {
        const byPath = new Map();
        for (const asset of data.assets || []) byPath.set(asset.path, {...asset, uses: 0});
        for (const binding of data.bindings || []) {
          const current = byPath.get(binding.path) || {path: binding.path, name: binding.path.split("/").pop(), kind: "post", uses: 0};
          current.uses += 1;
          byPath.set(binding.path, current);
        }
        const allAssets = [...byPath.values()].sort((a, b) => b.uses - a.uses || a.name.localeCompare(b.name));
        const query = mediaFilters.query.toLowerCase();
        const assets = allAssets.filter((asset) => (!query || `${asset.name} ${asset.path}`.toLowerCase().includes(query)) && (mediaFilters.source === "all" || asset.kind === mediaFilters.source) && (mediaFilters.usage === "all" || (mediaFilters.usage === "used" ? asset.uses > 0 : asset.uses === 0)));
        return `${liveSummary([["Shown", `${assets.length}/${allAssets.length}`], ["Library files", String((data.assets || []).length)], ["Post bindings", String((data.bindings || []).length)]])}
          ${assets.length ? `<div class="preview-media-grid">${assets.map((asset) => `<figure class="preview-media-item"><img src="${escapeHtml(publicMediaUrl(asset.path))}" alt="${escapeHtml(asset.name || "Media asset")}" loading="lazy" /><figcaption><strong>${escapeHtml(asset.name || asset.path)}</strong><span>${escapeHtml(asset.uses ? `${asset.uses} post bindings` : asset.kind || "media")}</span></figcaption></figure>`).join("")}</div>` : '<div class="preview-empty"><strong>No media matches</strong><span>Change or reset the filters.</span></div>'}`;
      }

      function renderItemCatalog(data) {

        if (!emojis.length) return '<div class="preview-empty"><strong>No items yet</strong><span>Generate the first project item above.</span></div>';
        return `${liveSummary([["Item type", "Emoji object"], ["Catalog", String(emojis.length)], ["Storage", "Current · shared"]])}<div class="preview-item-catalog">${emojis.map((emoji) => `<figure><img src="${escapeHtml(emoji.url)}" alt="${escapeHtml(emoji.name)}" loading="lazy" /><figcaption>${escapeHtml(emoji.name)}</figcaption></figure>`).join("")}</div>`;
      }

      function renderTemplateRegistry(data) {

      }

      function renderDashboardLive(data) {
        const posts = data.posts.posts || [];
        const assetPaths = new Set([...(data.assets.assets || []).map((item) => item.path), ...(data.assets.bindings || []).map((item) => item.path)]);
        const researchLatest = data.research.dates?.[0] || {};

        const release = data.changelog.entries?.[0];

        const recentPosts = posts.slice(0, 5);
        return `<div class="preview-live-summary preview-live-summary-four">${[["Posts",posts.length],["Rendered",rendered],["Media",assetPaths.size],["Latest research",researchItems]].map(([label,value])=>`<div><span>${label}</span><strong>${value}</strong></div>`).join("")}</div>
          <div class="preview-dashboard-actions"><a href="#/research/trends"><span>01 · Discover</span><strong>Research signals</strong><small>${researchLatest.date ? `${researchLatest.date} · ${researchItems} collected items` : "Collect the first snapshot"}</small></a><a href="#/creative-tools/post-generator"><span>02 · Produce</span><strong>Create content</strong><small>${posts.length - rendered} drafts · ${rendered} rendered</small></a><a href="#/content/calendar"><span>03 · Schedule</span><strong>Publishing calendar</strong><small>${calendarReady} ready · ${(data.calendar.items || []).length} total</small></a><a href="#/opportunities/active"><span>04 · Collaborate</span><strong>Active Collabs</strong><small>${activeCollabs} active relationships</small></a></div>
          <div class="preview-dashboard-columns"><section><div class="preview-section-head"><div><span>Recent work</span><h2>Latest Current posts</h2></div><a href="#/content/posts">Open Posts</a></div><div class="preview-dashboard-list">${recentPosts.map((post) => `<a href="/picker.html#/content/posts/${encodeURIComponent(post.id)}" data-current-link><div><span>${escapeHtml(post.templateName || "Post")}</span><strong>${escapeHtml(post.name || post.subject || "Untitled")}</strong></div><small>${escapeHtml(`${post.cardCount || 0} slides · ${post.hasRender ? "rendered" : "draft"}`)}</small></a>`).join("")}</div></section><section><div class="preview-section-head"><div><span>Version ${escapeHtml(data.changelog.productVersion || "—")}</span><h2>Recent changes</h2></div><a href="#/systems/changelog">Full changelog</a></div><div class="preview-dashboard-changes">${changes.map((change) => `<article><span>${escapeHtml(`${change.type} · ${change.area}`)}</span><strong>${escapeHtml(change.summary)}</strong></article>`).join("")}</div></section></div>

      function researchFavoriteButton(type, id, favoriteIds) {

      }

      function liveNewsCard(item, favoriteIds = new Set(), date = "") {
        return `<article class="preview-live-card preview-live-card--signal">
          <a class="preview-live-media" href="${escapeHtml(safeExternalUrl(item.url))}" target="_blank" rel="noreferrer">${item.imageUrl ? `<img src="${escapeHtml(safeExternalUrl(item.imageUrl))}" alt="" loading="lazy" />` : `<span>${escapeHtml(item.categoryLabel || "News")}</span>`}</a>
          <div class="preview-live-body"><div class="preview-live-meta"><span>${escapeHtml(item.categoryLabel || item.category || "News")}</span><span>${escapeHtml(date || `${item.importanceScore || 0}/10`)}</span></div><h3>${escapeHtml(item.title)}</h3><p>${escapeHtml(item.summary || item.sourceName || "")}</p><footer><span>${escapeHtml(item.sourceName || "Source")}</span><div>${researchFavoriteButton("news", item.id, favoriteIds)}<button type="button" class="preview-primary preview-small" data-use-source="${escapeHtml(item.title)}">Use in post</button></div></footer></div>
        </article>`;

      function liveVideoCard(item, favoriteIds = new Set(), date = "") {
        return `<article class="preview-live-card preview-live-card--signal">
          <a class="preview-live-media" href="${escapeHtml(safeExternalUrl(item.url))}" target="_blank" rel="noreferrer">${item.thumbnailUrl ? `<img src="${escapeHtml(safeExternalUrl(item.thumbnailUrl))}" alt="" loading="lazy" />` : `<span>YouTube</span>`}</a>
          <div class="preview-live-body"><div class="preview-live-meta"><span>${escapeHtml(item.channelName || "YouTube")}</span><span>${escapeHtml(date || item.duration || "Video")}</span></div><h3>${escapeHtml(item.title)}</h3><p>${escapeHtml(`${formatLiveNumber(item.viewCount)} views · ${formatLiveNumber(item.likeCount)} likes · ${formatLiveNumber(item.commentCount)} comments`)}</p><footer><span>${escapeHtml((item.matchedHashtags || item.hashtags || []).slice(0, 2).map((tag) => `#${String(tag).replace(/^#/, "")}`).join(" "))}</span><div>${researchFavoriteButton("youtube", item.id, favoriteIds)}<button type="button" class="preview-primary preview-small" data-use-source="${escapeHtml(item.title)}">Use in post</button></div></footer></div>

      function renderLiveNews(data, favoriteIds = new Set()) {
        const items = [...(data.items || [])].sort((a, b) => (b.importanceScore || 0) - (a.importanceScore || 0));
        return `${liveSummary([["Collection", formatLiveDate(data.date, true)], ["News", String(items.length)], ["Updated", formatLiveDate(data.collectedAt)]])}
          <div class="preview-live-grid">${items.slice(0, 24).map((item) => liveNewsCard(item, favoriteIds)).join("")}</div>`;
      }

      function renderLiveVideos(data, favoriteIds = new Set()) {
        const items = [...(data.items || [])].sort((a, b) => (b.viewCount || 0) - (a.viewCount || 0));
        return `${liveSummary([["Collection", formatLiveDate(data.date, true)], ["Videos", String(items.length)], ["Updated", formatLiveDate(data.collectedAt)]])}
          <div class="preview-live-grid">${items.slice(0, 24).map((item) => liveVideoCard(item, favoriteIds)).join("")}</div>${items.length > 24 ? `<p class="preview-live-footnote">Showing 24 most viewed videos of ${items.length}.</p>` : ""}`;
      }

      function renderLiveTrends(data) {
        const tags = Object.values(data.tags || {}).sort((a, b) => (b.newViews || 0) - (a.newViews || 0));
        const maxViews = Math.max(1, ...tags.map((tag) => Number(tag.newViews) || 0));
        return `${liveSummary([["Snapshot", formatLiveDate(data.date, true)], ["Tracked tags", String(tags.length)], ["Updated", formatLiveDate(data.collectedAt)]])}
          <div class="preview-live-trends">${tags.map((tag) => `<article><div><strong>#${escapeHtml(tag.tag)}</strong><span>${formatLiveNumber(tag.newVideos)} videos</span></div><i style="--trend:${Math.max(2, Math.round((Number(tag.newViews || 0) / maxViews) * 100))}%"></i><footer><span>${formatLiveNumber(tag.newViews)} views</span><span>${formatLiveNumber(tag.newLikes)} likes</span><span>${formatLiveNumber(tag.newComments)} comments</span></footer></article>`).join("")}</div>`;
      }

      function renderUnifiedTrends(data, favoriteIds = new Set()) {
        const tags = data.tags || [];
        const items = data.items || [];
        const connected = data.connections || {};
        const periodLabel = data.period === "month" ? "Month" : data.period === "week" ? "Week" : "Today";
        const sourceLabel = data.source === "all" ? "All connected" : data.source === "youtube" ? "YouTube" : data.source === "news" ? "News" : "TikTok";
        const connectionCards = [["YouTube",connected.youtube,"Videos + hashtag velocity"],["News",connected.news,"Articles + editorial importance"],["TikTok",connected.tiktok,"Awaiting account/API connection"]];
        const tagSection = tags.length ? `<section class="preview-section-head"><div><span>Hashtags · ${escapeHtml(periodLabel)}</span><h2>Momentum</h2></div></section><div class="preview-live-trends">${tags.slice(0,18).map((tag) => `<button type="button" data-trend-tag="${escapeHtml(tag.tag)}"><div><strong>#${escapeHtml(tag.tag)}</strong><span>${formatLiveNumber(tag.newVideos)} videos</span></div><i style="--trend:${Math.max(2,Math.round((Number(tag.newViews||0)/Math.max(1,...tags.map((row)=>Number(row.newViews)||0)))*100))}%"></i><footer><span>${formatLiveNumber(tag.newViews)} views</span><span>${formatLiveNumber(tag.newLikes)} likes</span><span>${formatLiveNumber(tag.newComments)} comments</span></footer></button>`).join("")}</div>` : "";
        return `${liveSummary([["Period",periodLabel],["Source",sourceLabel],["Signals",String(items.length)]])}<div class="preview-trend-sources">${connectionCards.map(([name,isConnected,description])=>`<article class="${isConnected ? "is-connected" : ""}"><span>${isConnected ? "Connected" : "Not connected"}</span><strong>${name}</strong><p>${description}</p></article>`).join("")}</div>${data.hashtag ? `<div class="preview-note"><strong>Hashtag filter · #${escapeHtml(data.hashtag)}</strong><span>${items.length} matching signals in the selected period.</span></div>` : ""}${tagSection}<section class="preview-section-head"><div><span>Feed</span><h2>Trend signals</h2></div></section>${items.length ? renderResearchResultItems(items,favoriteIds) : `<div class="preview-empty"><strong>No signals for this selection</strong><span>${data.source === "tiktok" ? "TikTok is not connected yet." : "Try another period, source or hashtag."}</span></div>`}`;

      function renderTestPackLive(posts, assetData) {
        const linkedPosts = posts.slice(0, 6);

      }

      const calendarStatuses = {
        planned: "Planned",
        draft: "Draft",
        review: "In review",
        ready: "Ready",
        published: "Published",
        blocked: "Blocked",
      };
      let calendarWeekStart = "";
      let calendarFilterStatus = "all";
      let calendarCache = {items: [], posts: []};

      function calendarDate(value) {
        return new Date(`${value}T12:00:00`);
      }

      function calendarIso(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function calendarAddDays(value, days) {
        const date = typeof value === "string" ? calendarDate(value) : new Date(value);
        date.setDate(date.getDate() + days);
        return calendarIso(date);
      }

      function calendarMonday(value) {
        const date = calendarDate(value);
        const weekday = date.getDay() || 7;
        date.setDate(date.getDate() - weekday + 1);
        return calendarIso(date);
      }

      function calendarDayLabel(value, options) {
        return new Intl.DateTimeFormat("en", options).format(calendarDate(value));
      }

      function calendarPostLabel(post) {
        return post.name || post.subject || post.templateName || "Untitled post";
      }

      function renderWorkingCalendar() {
        const {items, posts} = calendarCache;
        const postById = new Map(posts.map((post) => [String(post.id), post]));
        const weekDates = Array.from({length: 7}, (_, index) => calendarAddDays(calendarWeekStart, index));
        const weekEnd = weekDates[6];
        const visibleItems = items.filter((item) => item.date >= calendarWeekStart && item.date <= weekEnd && (calendarFilterStatus === "all" || item.status === calendarFilterStatus));
        const readyCount = items.filter((item) => item.status === "ready" || item.status === "published").length;
        const blockedCount = items.filter((item) => item.status === "blocked").length;
        const statusOptions = Object.entries(calendarStatuses).map(([value, label]) => `<option value="${value}">${escapeHtml(label)}</option>`).join("");
        const linkedPostOptions = posts.slice(0, 100).map((post) => `<option value="${escapeHtml(String(post.id))}">${escapeHtml(calendarPostLabel(post))}</option>`).join("");
        return `${liveSummary([["Scheduled", String(items.length)], ["Ready / published", String(readyCount)], ["Blocked", String(blockedCount)]])}
          <section class="preview-calendar-create">
            <div class="preview-calendar-create-head"><div><span>New publication</span><h3>Add to schedule</h3></div><p>Calendar records are saved separately. Linking a post does not change it.</p></div>
            <form id="calendar-event-form" class="preview-calendar-form">
              <label class="is-wide"><span>Title</span><input name="title" required maxlength="180" placeholder="Publication title" /></label>
              <label><span>Date</span><input name="date" type="date" required value="${calendarWeekStart}" /></label>
              <label><span>Channel</span><input name="channel" maxlength="80" value="Instagram" /></label>
              <label><span>Owner</span><input name="owner" maxlength="80" placeholder="Name" /></label>
              <label><span>Status</span><select name="status">${statusOptions}</select></label>
              <label class="is-wide"><span>Current post (optional)</span><select name="linkedPostId"><option value="">Not linked</option>${linkedPostOptions}</select></label>
              <label class="is-wide"><span>Notes</span><input name="notes" maxlength="500" placeholder="Approval, assets or deadline notes" /></label>
              <div class="preview-calendar-submit"><span data-calendar-form-status>Ready to save</span><button class="preview-primary" type="submit">Add publication</button></div>
            </form>
          </section>
          <div class="preview-calendar-toolbar">
            <div><button type="button" class="preview-secondary preview-small" data-calendar-week="-7">← Previous</button><button type="button" class="preview-secondary preview-small" data-calendar-next-scheduled>Next scheduled</button><button type="button" class="preview-secondary preview-small" data-calendar-week="7">Next →</button></div>
            <strong>${escapeHtml(calendarDayLabel(calendarWeekStart, {month: "short", day: "numeric"}))} — ${escapeHtml(calendarDayLabel(weekEnd, {month: "short", day: "numeric", year: "numeric"}))}</strong>
            <label><span>Status</span><select data-calendar-filter><option value="all">All statuses</option>${Object.entries(calendarStatuses).map(([value, label]) => `<option value="${value}" ${calendarFilterStatus === value ? "selected" : ""}>${escapeHtml(label)}</option>`).join("")}</select></label>
          </div>
          <div class="preview-calendar-scroll"><div class="preview-calendar-week">
            ${weekDates.map((date) => {
              const dayItems = visibleItems.filter((item) => item.date === date);
              return `<section class="preview-calendar-day ${date === calendarIso(new Date()) ? "is-today" : ""}"><header><span>${escapeHtml(calendarDayLabel(date, {weekday: "short"}))}</span><strong>${escapeHtml(calendarDayLabel(date, {day: "2-digit", month: "short"}))}</strong></header><div>${dayItems.length ? dayItems.map((item) => {
                const linkedPost = item.linkedPostId ? postById.get(String(item.linkedPostId)) : null;
                return `<article class="preview-calendar-event" data-status="${escapeHtml(item.status)}"><div class="preview-calendar-event-meta"><span>${escapeHtml(item.channel)}</span><button type="button" data-calendar-delete="${escapeHtml(item.id)}" aria-label="Delete ${escapeHtml(item.title)}">×</button></div><h3>${escapeHtml(item.title)}</h3><p>${escapeHtml(item.notes || "No notes")}</p>${linkedPost ? `<a href="/picker.html#/content/posts/${encodeURIComponent(linkedPost.id)}" data-current-link>Linked: ${escapeHtml(calendarPostLabel(linkedPost))} ↗</a>` : '<span class="preview-calendar-unlinked">No linked post</span>'}<footer><span>${escapeHtml(item.owner)}</span><select data-calendar-status="${escapeHtml(item.id)}" aria-label="Status for ${escapeHtml(item.title)}">${Object.entries(calendarStatuses).map(([value, label]) => `<option value="${value}" ${item.status === value ? "selected" : ""}>${escapeHtml(label)}</option>`).join("")}</select></footer></article>`;
              }).join("") : '<div class="preview-calendar-empty-day">No publications</div>'}</div></section>`;
            }).join("")}
          </div></div>
          <div class="preview-note">Working Calendar · events are stored in <code>data/content-calendar.json</code>. Posts are only linked and remain controlled by the Current Posts workspace.</div>`;
      }

      function bindCalendarActions(root, route) {
        root.querySelectorAll("[data-calendar-week]").forEach((button) => button.addEventListener("click", () => {
          calendarWeekStart = calendarAddDays(calendarWeekStart, Number(button.dataset.calendarWeek));
          root.innerHTML = renderWorkingCalendar();
          bindCalendarActions(root, route);
        }));
        root.querySelector("[data-calendar-next-scheduled]")?.addEventListener("click", () => {
          const next = calendarCache.items.find((item) => item.date >= calendarIso(new Date())) || calendarCache.items[0];
          if (next) calendarWeekStart = calendarMonday(next.date);
          root.innerHTML = renderWorkingCalendar();
          bindCalendarActions(root, route);
        });
        root.querySelector("[data-calendar-filter]")?.addEventListener("change", (event) => {
          calendarFilterStatus = event.currentTarget.value;
          root.innerHTML = renderWorkingCalendar();
          bindCalendarActions(root, route);
        });
        root.querySelector("#calendar-event-form")?.addEventListener("submit", async (event) => {
          event.preventDefault();
          const form = event.currentTarget;
          const submit = form.querySelector('button[type="submit"]');
          const status = form.querySelector("[data-calendar-form-status]");
          submit.disabled = true;
          status.textContent = "Saving…";
          try {
            const body = Object.fromEntries(new FormData(form).entries());
            const response = await fetch("/api/calendar", {method: "POST", headers: {"Content-Type": "application/json", Accept: "application/json"}, body: JSON.stringify(body)});
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "Could not add publication");
            calendarWeekStart = calendarMonday(data.event.date);
            await loadLiveData(route);
          } catch (error) {
            status.textContent = error.message;
            submit.disabled = false;
          }
        });
        root.querySelectorAll("[data-calendar-status]").forEach((select) => select.addEventListener("change", async () => {
          select.disabled = true;
          try {
            const response = await fetch(`/api/calendar/${encodeURIComponent(select.dataset.calendarStatus)}`, {method: "PUT", headers: {"Content-Type": "application/json", Accept: "application/json"}, body: JSON.stringify({status: select.value})});
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "Could not update status");
            await loadLiveData(route);
          } catch (error) {
            select.disabled = false;
            window.alert(error.message);
          }
        }));
        root.querySelectorAll("[data-calendar-delete]").forEach((button) => button.addEventListener("click", async () => {
          const item = calendarCache.items.find((entry) => entry.id === button.dataset.calendarDelete);
          if (!window.confirm(`Delete “${item?.title || "this publication"}” from Calendar?`)) return;
          button.disabled = true;
          try {
            const response = await fetch(`/api/calendar/${encodeURIComponent(button.dataset.calendarDelete)}`, {method: "DELETE", headers: {Accept: "application/json"}});
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "Could not delete publication");
            await loadLiveData(route);
          } catch (error) {
            button.disabled = false;
            window.alert(error.message);
          }
        }));
        bindCardActions(root);
      }

      let liveLoadToken = 0;

          } else if (route.section === "dashboard") {
            const [posts,assets,research,calendar,collabs,changelog]=await Promise.all([fetchLiveJson("/api/posts"),fetchLiveJson("/api/assets"),fetchLiveJson("/api/new-ia/research/archive"),fetchLiveJson("/api/calendar"),fetchLiveJson("/api/collabs"),fetchLiveJson("/api/changelog")]);
            if (token !== liveLoadToken) return;

            if(token!==liveLoadToken)return; const host=document.getElementById("systems-live"); if(host){host.innerHTML=renderSystemsLive(route.sub,{changelog,config,prompts,research,posts,assets,calendar,collabs});bindCardActions(host);}
          } else if (route.section === "brand" && route.sub === "presets") {

                trendFilters.hashtag = "";
                window.location.hash = "#/research/trends";
              }));

          if (token !== liveLoadToken) return;
          const host = document.getElementById("site-live") || document.getElementById("dashboard-live") || document.getElementById("analytics-live") || document.getElementById("systems-live") || document.getElementById("brand-presets-live") || document.getElementById("brand-assets-live") || document.getElementById("template-studio-live") || document.getElementById("item-generator-live") || document.getElementById("opportunities-live") || document.getElementById("calendar-live") || document.getElementById("content-live") || document.getElementById("research-live") || document.getElementById("project-live");

        document.getElementById("share-card-form")?.addEventListener("input", (event) => {
          const form=event.currentTarget; const values=Object.fromEntries(new FormData(form).entries()); const preview=document.getElementById("share-card-preview");
          preview.dataset.accent=values.accent; preview.querySelector("strong").textContent=values.title||"Untitled page"; preview.querySelector("p").textContent=values.description||"Add a description";
        });
        document.querySelectorAll("[data-pose]").forEach((button) => button.addEventListener("click", () => {
          selectedPose = button.dataset.pose;
          render();
        }));
        document.getElementById("build-attributes")?.addEventListener("click", () => {
          const theme = document.getElementById("mascot-theme").value.trim();
          if (!theme) {
            document.getElementById("mascot-theme").focus();
            document.getElementById("mascot-theme").classList.add("is-invalid");
            return;
          }
          mascotBuilt = true;
          mascotGenerated = false;
          render();
        });
        document.getElementById("generate-mascot")?.addEventListener("click", () => {
          mascotGenerated = true;
          render();
        });
        document.getElementById("research-search")?.addEventListener("submit", async (event) => {
          event.preventDefault();
          const query = document.getElementById("search-query").value.trim();
          const host = document.getElementById("research-live");
          if (!query) {
            host.innerHTML = '<div class="preview-empty">Enter a query to search the Current archive.</div>';
            return;
          }
          host.innerHTML = '<div class="preview-empty">Searching News and YouTube…</div>';
          try {
            const data = await fetchLiveJson(`/api/new-ia/research/search?q=${encodeURIComponent(query)}`);
            host.innerHTML = renderSearchResults(data);
            bindCardActions(host);
          } catch (error) {
            host.innerHTML = `<div class="preview-empty preview-live-error"><strong>Search failed</strong><span>${escapeHtml(error.message)}</span></div>`;
          }
        });
        document.querySelectorAll("[data-collect-research]").forEach((button) => button.addEventListener("click", async () => {
          const source = button.dataset.collectResearch;
          const status = document.querySelector("[data-collect-status]");
          const original = button.textContent;
          button.disabled = true;
          button.textContent = "Parsing…";
          if (status) status.textContent = source === "news" ? "Collecting current News sources…" : "Collecting YouTube videos and trends…";
          try {
            const endpoint = source === "news" ? "/ideas/api/collect" : "/ideas/api/collect-youtube";
            const response = await fetch(`${endpoint}?force=1`, {method: "POST", headers: {Accept: "application/json"}});
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || `Collection failed (${response.status})`);
            researchSelectedDates[route.sub] = "";
            if (status) status.textContent = "Collection updated just now";
            await loadLiveData(route);
          } catch (error) {
            if (status) status.textContent = error.message;
          } finally {
            button.disabled = false;
            button.textContent = original;
          }
        }));
      }

      function bindTrendTagActions(root, route) {
        root.querySelectorAll("[data-trend-tag]").forEach((button) => button.addEventListener("click", async () => {
          trendFilters.hashtag = button.dataset.trendTag || "";
          const input = document.querySelector('#trend-controls input[name="hashtag"]');
          if (input) input.value = trendFilters.hashtag ? `#${trendFilters.hashtag}` : "";
          await loadLiveData(route);
        }));
      }

      function bindCardActions(root) {
        root.querySelectorAll("[data-favorite]").forEach((button) => button.addEventListener("click", () => {
          const saved = button.classList.toggle("is-saved");
          button.textContent = saved ? "★ Saved" : "☆ Save";
        }));
        root.querySelectorAll("[data-use-source]").forEach((button) => button.addEventListener("click", () => {
          window.location.hash = "#/creative-tools/post-generator";
        }));
        root.querySelectorAll("[data-research-favorite]").forEach((button) => button.addEventListener("click", async () => {
          if (button.disabled) return;
          button.disabled = true;
          try {
            const response = await fetch("/ideas/api/favorites", {
              method: "POST",
              headers: {"Content-Type": "application/json", Accept: "application/json"},
              body: JSON.stringify({type: button.dataset.favoriteType, id: button.dataset.favoriteId, action: "toggle"}),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "Favorite update failed");
            button.classList.toggle("is-saved", Boolean(data.favorite));
            button.textContent = data.favorite ? "★ Saved" : "☆ Save";
            if (parseRoute()?.sub === "favorites") loadLiveData(parseRoute());
          } catch (error) {
            button.textContent = "Try again";
          } finally {
            button.disabled = false;
          }
        }));
        root.querySelectorAll("[data-current-link]").forEach((link) => link.addEventListener("click", () => {
          localStorage.setItem(ARCHITECTURE_MODE_KEY, "current");
        }));
      }

      function render() {
        const route = parseRoute();
        if (!route) return;
        if (route.invalid) {
          window.location.replace("#/dashboard");
          return;
        }
        document.getElementById("preview-nav").innerHTML = navItems.map((item) => item.disabled
          ? `<span class="preview-nav-disabled" aria-disabled="true" title="This section is not available yet"><span>${item.index}</span><b>${escapeHtml(item.label)}</b><small>Later</small></span>`
          : `<a href="${item.href}" class="${item.id === route.section ? "is-active" : ""}"><span>${item.index}</span>${escapeHtml(item.label)}</a>`).join("");
        renderSubnav(route);
        const sectionLabel = navItems.find((item) => item.id === route.section).label;
        const subLabel = sectionSubnavItems(route.section)?.find(([id]) => id === route.sub)?.[1];
        const pageLabel = route.section === "cases" && route.sub === "test-pack" ? "test-pack" : subLabel || sectionLabel;
        document.getElementById("preview-title").textContent = pageLabel;
        document.getElementById("preview-breadcrumb").textContent = `${projectConfig.name} / ${sectionLabel}${pageLabel !== sectionLabel ? ` / ${pageLabel}` : ""}`;
        const currentLink = document.getElementById("architecture-current-link");
        currentLink.href = `/picker.html${previewToCurrentHash(route)}`;
        let html = "";
        if (route.section === "dashboard") html = renderDashboard();
        else if (route.section === "brand") html = renderBrand(route.sub);
        else if (route.section === "research") html = renderResearch(route.sub);
        else if (route.section === "content") html = renderContent(route.sub);
        else if (route.section === "cases") html = renderCases(route.sub);
        else if (route.section === "opportunities") html = renderOpportunities(route.sub);
        else if (route.section === "creative-tools") html = renderCreativeTools(route.sub);
        else if (route.section === "knowledge") html = renderKnowledge(route.sub);
        else if (route.section === "site") html = renderSite(route.sub);
        else if (route.section === "analytics") html = renderAnalytics(route.sub, route.detail);
        else if (route.section === "systems") html = renderSystems(route.sub);
        else html = renderGeneric(route.section, route.sub);
        document.getElementById("preview-main").innerHTML = html;
        bindPrototypeActions(route);
        loadLiveData(route);
        document.querySelector(".preview-sidebar")?.classList.remove("is-open");
        document.getElementById("preview-menu-button").setAttribute("aria-expanded", "false");
      }

      localStorage.setItem(ARCHITECTURE_MODE_KEY, "new");
      document.title = `${projectConfig.name} — Universal IA Prototype`;
      document.getElementById("preview-project-name").textContent = projectConfig.name;
      document.getElementById("architecture-current-link").addEventListener("click", () => localStorage.setItem(ARCHITECTURE_MODE_KEY, "current"));
      document.getElementById("preview-menu-button").addEventListener("click", (event) => {
        const sidebar = document.querySelector(".preview-sidebar");
        const open = sidebar.classList.toggle("is-open");
        event.currentTarget.setAttribute("aria-expanded", String(open));
      });
      window.addEventListener("hashchange", render);
      if (!window.location.hash) window.location.replace("#/dashboard");
      else render();
    </script>
  </body>
</html>
