# Hostinger VPS + Traefik (HTTPS, Let's Encrypt)
# URL: https://dashboard-site.${TRAEFIK_HOST}
# Пример: https://dashboard-site.srv1681126.hstgr.cloud

services:
  dashboard-site:
    build:
      context: .
      args:
        SITE_PASSWORD: ${SITE_PASSWORD}
    container_name: dashboard-site
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      EXA_API_KEY: ${EXA_API_KEY}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 12 * * *}
      CRON_TZ: ${CRON_TZ:-Europe/Moscow}
      SITE_PASSWORD: ${SITE_PASSWORD}
    volumes:
      - dashboard-data:/app/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard-site.rule=Host(`dashboard-site.${TRAEFIK_HOST}`)
      - traefik.http.routers.dashboard-site.entrypoints=websecure
      - traefik.http.routers.dashboard-site.tls.certresolver=letsencrypt
      - traefik.http.services.dashboard-site.loadbalancer.server.port=3000

volumes:
  dashboard-data:
